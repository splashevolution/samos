insmod all_video
insmod vbe
insmod vga
insmod gfxterm

# CI variant: identical to grub.cfg but boots with the "ci" kernel
# argument, which skips the interactive first-boot wizard (headless).
set gfxmode=1024x768x32,800x600x32,auto
terminal_output gfxterm

set timeout=0
set default=0

menuentry "SAM OS v0.1.0 - Structured Adaptive Machine (CI)" {
    set gfxpayload=keep
    multiboot2 /boot/sam_os.elf ci
    module2    /boot/test.gguf      "gguf_model"
    module2    /boot/test_model.stf "stf_model"
    module2    /boot/initrd.tar     "initrd"
    boot
}
