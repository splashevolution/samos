insmod all_video
insmod vbe
insmod vga
insmod gfxterm

# Try 1024x768x32 first, fall back through smaller modes if unavailable.
# "auto" picks the best mode VBoxVGA actually supports via VBE.
set gfxmode=1024x768x32,800x600x32,auto
terminal_output gfxterm

set timeout=2
set default=0

menuentry "SAM OS v0.1.0 - Structured Adaptive Machine" {
    set gfxpayload=keep
    multiboot2 /boot/sam_os.elf
    module2    /boot/test.gguf      "gguf_model"
    module2    /boot/test_model.stf "stf_model"
    boot
}
